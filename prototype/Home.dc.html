<style>
body{margin:0}
a{color:inherit;text-decoration:none}
.fd{font-family:'Fredoka','Nunito',sans-serif}
.chip{border:3px solid #7A5545;border-radius:16px;box-shadow:0 3px 0 #D9B8A0;cursor:pointer;font-family:'Fredoka','Nunito',sans-serif;font-weight:600;color:#6A4A3C;background:#FFFBF4}
.chip:active{transform:translateY(2px);box-shadow:0 1px 0 #D9B8A0}
.chip:disabled{cursor:default}
.wood{border:3px solid #7A5545;border-radius:16px;background:#F59A93;box-shadow:0 3px 0 #C9726C;color:#FFFBF4;text-shadow:0 1px 0 #B85C57;font-family:'Fredoka','Nunito',sans-serif;font-weight:600;cursor:pointer}
.wood:active{transform:translateY(2px);box-shadow:0 1px 0 #C9726C}
.wood:disabled{background:#D9C9BC;border-color:#A8907F;box-shadow:0 3px 0 #A8907F;text-shadow:none;cursor:default}
.pill{display:flex;align-items:center;gap:6px;height:36px;padding:0 6px;box-sizing:border-box;border-radius:18px;background:#FFFBF4;border:3px solid #7A5545;font-family:'Fredoka','Nunito',sans-serif;font-weight:600;font-size:16px;color:#6A4A3C}
.plus{width:22px;height:22px;box-sizing:border-box;border-radius:11px;background:#8CCB6B;border:2px solid #7A5545;color:#FFFFFF;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;line-height:1}
.nav{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-around;align-items:center;height:92px;box-sizing:border-box;padding:10px 8px 14px;background:#FBF1DE;border-top:3px solid #7A5545;z-index:5}
.tile{position:relative;width:62px;height:64px;box-sizing:border-box;border:3px solid #7A5545;border-radius:16px;background:#FFFBF4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-family:'Fredoka','Nunito',sans-serif;font-size:11.5px;font-weight:600;color:#6A4A3C}
.tile.on{background:#CFE3B4}
.tile:active{transform:translateY(2px)}
.rdot{position:absolute;top:-9px;right:-7px;width:18px;height:18px;box-sizing:border-box;border-radius:50%;background:#F04E4E;border:2.5px solid #FFFBF4}
.spot{position:absolute;border:0;background:transparent;padding:0;cursor:pointer;z-index:3}
.ico{display:flex;flex-direction:column;align-items:center;gap:0;border:0;background:transparent;padding:0;cursor:pointer;font-family:'Fredoka','Nunito',sans-serif;font-size:16px;font-weight:600;color:#7A5A4A;position:relative}
.ico span.b{width:56px;height:46px;box-sizing:border-box;border-radius:20px;background:rgba(255,251,244,0.9);display:flex;align-items:center;justify-content:center}
.pill.big{height:44px;font-size:21px;border-color:#7A5A4A;box-shadow:inset 0 0 0 2px #FFFBF4;background:#FBF4E6}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes ping{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
@keyframes pop{0%{transform:translateY(-24px);opacity:0}12%{transform:translateY(0);opacity:1}85%{opacity:1}100%{opacity:0}}
</style>
</helmet>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { spot: null, done: { desk: false, plant: true, arch: false, bed: false }, coins: 245, xp: 60, level: 3, chest: false, toast: null, ax: 205, ay: 480 };
}
spots() {
return [
{ id: 'desk', name: 'Budget desk', ax: 215, ay: 322, pos: 'left: 124px; top: 166px; width: 182px; height: 130px', mark: 'position: absolute; left: 76px; top: -30px', coins: 10, xp: 15, quest: true, title: 'Weekly budget check-in', text: 'Log this week\'s spending at your desk.' },
{ id: 'plant', name: 'Savings jar machine', ax: 160, ay: 470, pos: 'left: 14px; top: 358px; width: 100px; height: 116px', mark: 'position: absolute; left: 36px; top: -30px', coins: 10, xp: 15, quest: true, title: 'Feed the savings jar', text: 'Move a small amount into your goal pot.' },
{ id: 'door', name: 'Bazaar sign', ax: 336, ay: 296, pos: 'left: 296px; top: 180px; width: 90px; height: 100px', mark: 'position: absolute; left: 30px; top: -22px', coins: 0, xp: 0, quest: false, title: 'The Bazaar is open', text: 'Collect stamps from this season\'s booths.' },
{ id: 'arch', name: 'Wedding corner', ax: 270, ay: 600, pos: 'left: 306px; top: 500px; width: 80px; height: 140px', mark: 'position: absolute; left: 26px; top: -24px', coins: 15, xp: 20, quest: true, title: 'Plan the big day', text: 'Shortlist one vendor you like.' },
{ id: 'bed', name: 'Green chair', ax: 300, ay: 412, pos: 'left: 318px; top: 266px; width: 70px; height: 96px', mark: 'position: absolute; left: 20px; top: -26px', coins: 10, xp: 10, quest: true, title: 'Rest in your chair', text: 'Take a no-guilt break. Your streak stays safe.' }
];
}
tap(id) {
const sp = this.spots().filter((x) => x.id === id)[0];
this.setState({ spot: id, ax: sp.ax, ay: sp.ay });
}
doIt() {
const s = this.state;
const sp = this.spots().filter((x) => x.id === s.spot)[0];
if (!sp || !sp.quest || s.done[sp.id]) return;
const done = Object.assign({}, s.done);
done[sp.id] = true;
let xp = s.xp + sp.xp;
let level = s.level;
let toast = '+' + sp.coins + ' coins';
if (xp >= 100) { xp -= 100; level += 1; toast = 'Level up! Lv' + level; }
this.setState({ done: done, coins: s.coins + sp.coins, xp: xp, level: level, toast: toast });
setTimeout(() => this.setState({ toast: null }), 2000);
}
openChest() {
const s = this.state;
this.setState({ chest: true, coins: s.coins + 25, toast: 'Gift: +25 coins' });
setTimeout(() => this.setState({ toast: null }), 2000);
}
renderVals() {
const s = this.state;
const list = this.spots();
const count = list.filter((x) => x.quest && s.done[x.id]).length;
const cur = list.filter((x) => x.id === s.spot)[0];
let card = { title: 'Quests today: ' + Math.min(count, 3) + '/3', text: 'Tap a glowing ! bubble. Finish 3 to open your gift.', canDo: false, isDone: false, isGate: false, coins: 0 };
if (cur) {
card = { title: cur.title, text: cur.text, canDo: cur.quest && !s.done[cur.id], isDone: cur.quest && !!s.done[cur.id], isGate: !cur.quest, coins: cur.coins };
}
const ready = count >= 3 && !s.chest;
return {
coins: s.coins,
level: s.level,
xpW: s.xp + '%',
card: card,
spots: list.map((x) => ({
name: x.name,
pos: x.pos,
markStyle: x.mark,
markO: x.quest && s.done[x.id] ? 0 : 1,
tap: () => this.tap(x.id)
})),
avT: 'translate(' + (s.ax - 24) + 'px, ' + (s.ay - 64) + 'px)',
doIt: () => this.doIt(),
openChest: () => this.openChest(),
chestOff: !ready,
chestFade: ready ? 1 : 0.55,
giftDot: ready,
hasToast: !!s.toast,
toast: s.toast || ''
};
}
}
</script>
