<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Nunito:wght@600;700;800;900&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
.fd{font-family:'Fredoka','Nunito',sans-serif}
.chip{border:3px solid #7A5545;border-radius:16px;box-shadow:0 3px 0 #D9B8A0;cursor:pointer;font-family:'Fredoka','Nunito',sans-serif;font-weight:600;color:#6A4A3C;background:#FFFBF4}
.chip:active{transform:translateY(2px);box-shadow:0 1px 0 #D9B8A0}
.chip:disabled{cursor:default}
.wood{border:3px solid #7A5545;border-radius:16px;background:#F59A93;box-shadow:0 3px 0 #C9726C;color:#FFFBF4;text-shadow:0 1px 0 #B85C57;font-family:'Fredoka','Nunito',sans-serif;font-weight:600;cursor:pointer}
.wood:active{transform:translateY(2px);box-shadow:0 1px 0 #C9726C}
.wood:disabled{background:#D9C9BC;border-color:#A8907F;box-shadow:0 3px 0 #A8907F;text-shadow:none;cursor:default}
.pill{display:flex;align-items:center;gap:6px;height:36px;padding:0 6px;box-sizing:border-box;border-radius:18px;background:#FFFBF4;border:3px solid #7A5545;font-family:'Fredoka','Nunito',sans-serif;font-weight:600;font-size:16px;color:#6A4A3C}
.plus{width:22px;height:22px;box-sizing:border-box;border-radius:11px;background:#8CCB6B;border:2px solid #7A5545;color:#FFFFFF;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;line-height:1}
.nav{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-around;align-items:center;height:92px;box-sizing:border-box;padding:10px 8px 14px;background:#FBF1DE;border-top:3px solid #7A5545;z-index:5}
.tile{position:relative;width:62px;height:64px;box-sizing:border-box;border:3px solid #7A5545;border-radius:16px;background:#FFFBF4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-family:'Fredoka','Nunito',sans-serif;font-size:11.5px;font-weight:600;color:#6A4A3C}
.tile.on{background:#CFE3B4}
.tile:active{transform:translateY(2px)}
.rdot{position:absolute;top:-9px;right:-7px;width:18px;height:18px;box-sizing:border-box;border-radius:50%;background:#F04E4E;border:3px solid #FFFBF4}
body{margin:0}
a{color:inherit;text-decoration:none}
.fd{font-family:'Fredoka','Nunito',sans-serif}
.booth{position:absolute;width:150px;height:150px;border:0;background:transparent;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center}
.booth:active{transform:translateY(2px)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes pop{0%{transform:translateY(-24px);opacity:0}12%{transform:translateY(0);opacity:1}85%{opacity:1}100%{opacity:0}}
@keyframes up{0%{transform:translateY(60px);opacity:0}100%{transform:translateY(0);opacity:1}}
</style>
</helmet>

<button type="button" class="chip" onClick="{{closeSheet}}" aria-label="Close" style="width: 38px; height: 38px; border-radius: 19px; font-size: 18px; flex-shrink: 0">x</button>
</div>
<div style="padding: 10px 12px; border-radius: 16px; background: #FBE7A8; border: 2px solid #7A5545; font-size: 14px; font-weight: 800; line-height: 1.35">{{sheet.offer}}</div>
<button type="button" onClick="{{toggleConsent}}" aria-pressed="{{sheet.consent}}" style="display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 16px; border: 3px solid #7A5545; background: #FFFDF8; text-align: left; cursor: pointer; font-family: inherit; color: #6A4A3C">
<span style="width: 46px; height: 26px; box-sizing: border-box; border-radius: 13px; border: 3px solid #7A5545; background: {{sheet.swBg}}; position: relative; flex-shrink: 0"><span style="position: absolute; top: 1.5px; left: {{sheet.knob}}; width: 18px; height: 18px; border-radius: 9px; background: #FFF6E3; border: 2px solid #7A5545; transition: left 0.15s"></span></span>
<span style="font-size: 13.5px; font-weight: 800; line-height: 1.3">Share my contact with this brand. You can say no. The stamp is yours either way.</span>
</button>
<button type="button" class="wood" onClick="{{collect}}" disabled="{{sheet.stamped}}" style="height: 50px; font-size: 18px">{{sheet.btn}}</button>
</div>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { theme: 'wedding', stamped: {}, consent: {}, sheet: null, coins: 245, toast: null, ax: 195, ay: 400 };
}
data() {
return {
wedding: {
title: 'Wedding Bazaar',
sub: 'Pop-up season. Open this weekend.',
booths: [
{ id: 'w1', name: 'Kebaya Studio', kind: 'dress', awn: '#F3B8B0', offer: 'Free fitting session plus a IDR 50k voucher.' },
{ id: 'w2', name: 'Cake & Catering', kind: 'cake', awn: '#F6DF8E', offer: 'Free tasting box for two.' },
{ id: 'w3', name: 'Photo Booth Co.', kind: 'camera', awn: '#8DBDD9', offer: 'A free mini photo shoot slot.' },
{ id: 'w4', name: 'Rings & Gifts', kind: 'ring', awn: '#B7D3A0', offer: '10% off engraved rings this weekend.' }
]
},
life: {
title: 'Life Bazaar',
sub: 'Starter season for solo living.',
booths: [
{ id: 'l1', name: 'Home Starter', kind: 'house', awn: '#C9B6EA', offer: 'A free home-budget check with a partner agent.' },
{ id: 'l2', name: 'Kopi Corner', kind: 'cup', awn: '#F0A65E', offer: 'Buy one, get one coffee voucher.' },
{ id: 'l3', name: 'Cooking Class', kind: 'cake', awn: '#F6DF8E', offer: 'Free first class for solo cooks.' },
{ id: 'l4', name: 'Wardrobe Swap', kind: 'dress', awn: '#F3B8B0', offer: 'Swap three items, get a thrift credit.' }
]
}
};
}
spotFor(i) {
return { ax: 195, ay: i < 2 ? 394 : 572 };
}
collect() {
const s = this.state;
const id = s.sheet;
if (!id || s.stamped[id]) return;
const stamped = Object.assign({}, s.stamped);
stamped[id] = true;
const list = this.data()[s.theme].booths;
const all = list.every((b) => stamped[b.id]);
this.setState({ stamped: stamped, coins: s.coins + 10, sheet: null, toast: all ? 'Passport complete: lantern unlocked' : 'Stamp collected +10 coins' });
setTimeout(() => this.setState({ toast: null }), 2000);
}
renderVals() {
const s = this.state;
const D = this.data();
const cur = D[s.theme];
const booths = cur.booths.map((b, i) => {
const col = i % 2;
const row = Math.floor(i / 2);
const sp = this.spotFor(i);
const o = { cake: 0, dress: 0, camera: 0, ring: 0, house: 0, cup: 0 };
o[b.kind] = 1;
return {
name: b.name,
awn: b.awn,
o: o,
left: (col === 0 ? 20 : 220) + 'px',
top: (262 + row * 178) + 'px',
stampO: s.stamped[b.id] ? 1 : 0,
tap: () => this.setState({ sheet: b.id, ax: sp.ax, ay: sp.ay })
};
});
const stampN = cur.booths.filter((b) => s.stamped[b.id]).length;
const passport = cur.booths.map((b) => ({ bg: s.stamped[b.id] ? '#FBE7A8' : '#FFFDF8', o: s.stamped[b.id] ? 1 : 0 }));
const themes = [['wedding', 'Wedding Bazaar'], ['life', 'Life Bazaar']].map((t) => ({
label: t[1],
on: s.theme === t[0],
bg: s.theme === t[0] ? '#F9C4BF' : '#FFF6E3',
pick: () => this.setState({ theme: t[0], sheet: null, ax: 195, ay: 400 })
}));
const sb = s.sheet ? cur.booths.filter((b) => b.id === s.sheet)[0] : null;
const on = sb ? !!s.consent[sb.id] : false;
const done = sb ? !!s.stamped[sb.id] : false;
return {
coins: s.coins,
title: cur.title,
sub: cur.sub,
stampN: stampN,
booths: booths,
passport: passport,
themes: themes,
avT: 'translate(' + (s.ax - 24) + 'px, ' + (s.ay - 64) + 'px)',
hasSheet: !!sb,
sheet: sb ? { name: sb.name, offer: sb.offer, consent: on, swBg: on ? '#8CBF6B' : '#EADFC4', knob: on ? '23px' : '2px', stamped: done, btn: done ? 'Stamp collected' : 'Collect stamp +10' } : { name: '', offer: '', consent: false, swBg: '#EADFC4', knob: '2px', stamped: false, btn: '' },
closeSheet: () => this.setState({ sheet: null }),
toggleConsent: () => { const c = Object.assign({}, this.state.consent); c[this.state.sheet] = !c[this.state.sheet]; this.setState({ consent: c }); },
collect: () => this.collect(),
hasToast: !!s.toast,
toast: s.toast || ''
};
}
}
</script>
</body>
</html>
