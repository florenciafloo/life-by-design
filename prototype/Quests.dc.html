.pill{display:flex;align-items:center;gap:6px;height:36px;padding:0 6px;box-sizing:border-box;border-radius:18px;background:#FFFBF4;border:3px solid #7A5545;font-family:'Fredoka','Nunito',sans-serif;font-weight:600;font-size:16px;color:#6A4A3C}

.nav{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-around;align-items:center;height:92px;box-sizing:border-box;padding:10px 8px 14px;background:#FBF1DE;border-top:3px solid #7A5545;z-index:5}
.tile{position:relative;width:62px;height:64px;box-sizing:border-box;border:3px solid #7A5545;border-radius:16px;background:#FFFBF4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-family:'Fredoka','Nunito',sans-serif;font-size:11.5px;font-weight:600;color:#6A4A3C}
.tile.on{background:#CFE3B4}
.tile:active{transform:translateY(2px)}
.rdot{position:absolute;top:-9px;right:-7px;width:18px;height:18px;box-sizing:border-box;border-radius:50%;background:#F04E4E;border:3px solid #FFFBF4}
body{margin:0}
a{color:inherit;text-decoration:none}
.fd{font-family:'Fredoka','Nunito',sans-serif}
.node{position:absolute;width:56px;height:56px;box-sizing:border-box;border-radius:50%;border:3px solid #7A5545;box-shadow:0 4px 0 #7A5545;display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;z-index:2}

@keyframes ping{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}

{ n: 'Get the keys', t: 'Sign for your own place. Big moment.', g: 'the whole home levels up.' }
]
},
wedding: {
era: 'Engagement Era',
cutTitle: 'The big day is here.',
cutSub: 'Everything you planned, one step at a time.',
nodes: [
{ n: 'Pick the season', t: 'Choose a date range you both like.', g: 'a calendar appears on the wall.' },
{ n: 'Guest draft', t: 'Draft a first guest list. No pressure.', g: 'a cozy table for two.' },
{ n: 'Wedding fund', t: 'Open a dedicated wedding fund.', g: 'a flower arch in the garden.' },
{ n: 'Wedding Bazaar', t: 'Collect a stamp at the Wedding Bazaar.', g: 'string lights over the porch.' },
{ n: 'Shortlist vendors', t: 'Shortlist three vendors you like.', g: 'a moodboard above the sofa.' },
{ n: 'Book the venue', t: 'Lock in the venue and date.', g: 'the whole home levels up.' }
]
}
};
}
complete() {
const s = this.state;
const i = s.sheet;
if (i === null) return;
const steps = Object.assign({}, s.steps);
if (steps[s.tab] !== i) return;
steps[s.tab] = i + 1;
const last = i === 5;
const gain = last ? 50 : 15;
this.setState({ steps: steps, sheet: null, coins: s.coins + gain, toast: '+' + gain + ' coins', cut: last });
setTimeout(() => this.setState({ toast: null }), 1800);
}
renderVals() {
const s = this.state;
const D = this.data();
const cur = D[s.tab];
const step = s.steps[s.tab];
const pts = [[110, 50], [280, 140], [110, 230], [280, 320], [110, 410], [196, 500]];
const nodes = cur.nodes.map((nd, i) => {
const x = pts[i][0];
const y = pts[i][1] + 150;
const isDone = i < step;
const isCur = i === step;
const isLock = i > step;
const key = i === 5;
let bg = '#EADFC4';
if (isDone) bg = '#CFE3B4';
if (isCur) bg = '#F7B8B0';
if (key && !isDone) bg = isCur ? '#F9C4BF' : '#F0E3B8';
return {
name: nd.n,
left: (x - 28) + 'px',
top: (y - 28) + 'px',
lblLeft: (x - 75) + 'px',
lblTop: (y + 32) + 'px',
avLeft: (x - 17) + 'px',
avTop: (y - 76) + 'px',
bg: bg,
anim: isCur ? 'animation: ping 1.3s ease-in-out infinite' : '',
isDone: isDone,
isCur: isCur,
isLock: isLock,
tap: () => { if (isCur) this.setState({ sheet: i }); }
};
});
const tabs = [['solo', 'Solo Era'], ['wedding', 'Engagement Era']].map((t) => ({
label: t[1],
on: s.tab === t[0],
bg: s.tab === t[0] ? '#F9C4BF' : '#FFF6E3',
pick: () => this.setState({ tab: t[0] })
}));
const sn = s.sheet !== null ? cur.nodes[s.sheet] : null;
return {
coins: s.coins,
tabs: tabs,
nodes: nodes,
hasSheet: s.sheet !== null,
sheet: sn ? { era: cur.era, name: sn.n, text: sn.t, grow: sn.g, coins: s.sheet === 5 ? 50 : 15 } : { era: '', name: '', text: '', grow: '', coins: 0 },
closeSheet: () => this.setState({ sheet: null }),
complete: () => this.complete(),
hasToast: !!s.toast,
toast: s.toast || '',
hasCut: s.cut,
cut: { title: cur.cutTitle, sub: cur.cutSub },
saved: s.saved,
saveBg: s.saved ? '#B7D3A0' : '#FFF6E3',
saveLabel: s.saved ? 'Saved to your memories' : 'Save this moment',
toggleSave: () => this.setState({ saved: !this.state.saved }),
closeCut: () => this.setState({ cut: false })
};
}
}
</script>
