<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { tab: 'vouchers', coins: 245, claimed: {}, toast: null };
}
items() {
return [
{ id: 'v1', tab: 'vouchers', name: 'Kopi voucher', note: 'IDR 20k off at a partner cafe', cost: 120, kind: 'cup', tint: '#F8E3C2' },
{ id: 'v2', tab: 'vouchers', name: 'Bakery 10% off', note: 'Any weekend this month', cost: 80, kind: 'cake', tint: '#F9D6D0' },
{ id: 'v3', tab: 'vouchers', name: 'Co-working day', note: 'One free day pass', cost: 200, kind: 'ticket', tint: '#DDEFF2' },
{ id: 'v4', tab: 'vouchers', name: 'Cinema for two', note: 'Two tickets, any show', cost: 260, kind: 'ticket', tint: '#DDEFF2' },
{ id: 'd1', tab: 'decor', name: 'Sunny curtains', note: 'Warm light for your window', cost: 50, kind: 'curtain', tint: '#FBF0C4' },
{ id: 'd2', tab: 'decor', name: 'Pillow set', note: 'Two cozy pillows', cost: 40, kind: 'pillow', tint: '#F9D6D0' },
{ id: 'd3', tab: 'decor', name: 'Porch lantern', note: 'Glows after dark', cost: 90, kind: 'lantern', tint: '#FBF0C4' },
{ id: 'd4', tab: 'decor', name: 'Garden arch', note: 'Roses and ivy', cost: 140, kind: 'arch', tint: '#DCEBCF' },
{ id: 'm1', tab: 'limited', name: 'Founder lantern', note: 'Reach level 5', cost: 0, kind: 'lantern', tint: '#EFE6D2', locked: 'Level 5' },
{ id: 'm2', tab: 'limited', name: 'Wedding arch', note: 'Finish the Wedding passport', cost: 0, kind: 'arch', tint: '#EFE6D2', locked: '4 of 4 stamps' },
{ id: 'm3', tab: 'limited', name: 'Ramadan lights', note: 'Seasonal drop', cost: 0, kind: 'lantern', tint: '#EFE6D2', locked: 'Coming soon' }
];
}
claim(id) {
const s = this.state;
const it = this.items().filter((x) => x.id === id)[0];
if (!it || it.locked || s.claimed[id] || s.coins < it.cost) return;
const claimed = Object.assign({}, s.claimed);
claimed[id] = true;
this.setState({ claimed: claimed, coins: s.coins - it.cost, toast: 'Claimed: ' + it.name });
setTimeout(() => this.setState({ toast: null }), 2000);
}
renderVals() {
const s = this.state;
const cards = this.items().filter((x) => x.tab === s.tab).map((it) => {
const got = !!s.claimed[it.id];
const locked = !!it.locked;
const cant = !got && !locked && s.coins < it.cost;
let btn = 'Claim ' + it.cost;
let btnBg = '#F6DF8E';
if (locked) { btn = it.locked; btnBg = '#EADFC4'; }
else if (got) { btn = it.tab === 'decor' ? 'In your room' : 'In your bag'; btnBg = '#B7D3A0'; }
else if (cant) { btn = 'Need ' + (it.cost - s.coins) + ' more'; btnBg = '#EADFC4'; }
return {
name: it.name,
note: it.note,
tint: it.tint,
btn: btn,
btnBg: btnBg,
off: locked || got || cant,
fade: locked ? 0.75 : 1,
isCup: it.kind === 'cup',
isCake: it.kind === 'cake',
isTicket: it.kind === 'ticket',
isCurtain: it.kind === 'curtain',
isPillow: it.kind === 'pillow',
isLantern: it.kind === 'lantern',
isArch: it.kind === 'arch',
tap: () => this.claim(it.id)
};
});
const tabs = [['vouchers', 'Vouchers'], ['decor', 'Decor'], ['limited', 'Limited']].map((t) => ({
label: t[1],
on: s.tab === t[0],
bg: s.tab === t[0] ? '#F9C4BF' : '#FFF6E3',
pick: () => this.setState({ tab: t[0] })
}));
return { coins: s.coins, cards: cards, tabs: tabs, hasToast: !!s.toast, toast: s.toast || '' };
}
}
</script>
