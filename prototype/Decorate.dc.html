<style>
body{margin:0}
a{color:inherit;text-decoration:none}
.fd{font-family:'Fredoka','Nunito',sans-serif}
.chip{border:3px solid #7A5545;border-radius:16px;box-shadow:0 3px 0 #D9B8A0;cursor:pointer;font-family:'Fredoka','Nunito',sans-serif;font-weight:600;color:#6A4A3C;background:#FFFBF4}
.chip:active{transform:translateY(2px);box-shadow:0 1px 0 #D9B8A0}
.chip:disabled{cursor:default}
.wood{border:3px solid #7A5545;border-radius:16px;background:#F59A93;box-shadow:0 3px 0 #C9726C;color:#FFFBF4;text-shadow:0 1px 0 #B85C57;font-family:'Fredoka','Nunito',sans-serif;font-weight:600;cursor:pointer}
.wood:active{transform:translateY(2px);box-shadow:0 1px 0 #C9726C}
.wood:disabled{background:#D9C9BC;border-color:#A8907F;box-shadow:0 3px 0 #A8907F;text-shadow:none;cursor:default}
.pill{display:flex;align-items:center;gap:6px;height:36px;padding:0 6px;box-sizing:border-box;border-radius:18px;background:#FFFBF4;border:3px solid #7A5545;font-family:'Fredoka','Nunito',sans-serif;font-weight:600;font-size:16px;color:#6A4A3C}
.plus{width:22px;height:22px;box-sizing:border-box;border-radius:11px;background:#8CCB6B;border:2px solid #7A5545;color:#FFFFFF;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;line-height:1}
.nav{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-around;align-items:center;height:92px;box-sizing:border-box;padding:10px 8px 14px;background:#FBF1DE;border-top:3px solid #7A5545;z-index:5}
.tile{position:relative;width:62px;height:64px;box-sizing:border-box;border:3px solid #7A5545;border-radius:16px;background:#FFFBF4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-family:'Fredoka','Nunito',sans-serif;font-size:11.5px;font-weight:600;color:#6A4A3C}
.tile.on{background:#CFE3B4}
.tile:active{transform:translateY(2px)}
.rdot{position:absolute;top:-9px;right:-7px;width:18px;height:18px;box-sizing:border-box;border-radius:50%;background:#F04E4E;border:2.5px solid #FFFBF4}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes pop{0%{transform:translateY(-24px);opacity:0}12%{transform:translateY(0);opacity:1}85%{opacity:1}100%{opacity:0}}
</style>
</helmet>

items() {
return [
{ id: 'rug', name: 'Sage rug', cat: 'furniture', cost: 30, kind: 'rug' },
{ id: 'lamp', name: 'Butter lamp', cat: 'furniture', cost: 45, kind: 'lamp' },
{ id: 'chair', name: 'Blush armchair', cat: 'furniture', cost: 80, kind: 'chair' },
{ id: 'art', name: 'Morning art', cat: 'decor', cost: 60, kind: 'art' },
{ id: 'plant', name: 'Fern in a pot', cat: 'decor', cost: 35, kind: 'plant' },
{ id: 'lantern', name: 'Bazaar lantern', cat: 'limited', cost: 0, kind: 'lantern', locked: '2 of 6 stamps' },
{ id: 'ramadan', name: 'Ramadan lanterns', cat: 'limited', cost: 0, kind: 'lantern', locked: 'Coming soon' }
];
}
tap(id) {
const s = this.state;
const all = this.items();
let it = null;
for (let i = 0; i < all.length; i++) { if (all[i].id === id) it = all[i]; }
if (!it || it.locked) return;
const owned = Object.assign({}, s.owned);
const placed = Object.assign({}, s.placed);
if (!owned[id]) {
if (s.coins < it.cost) return;
owned[id] = true;
placed[id] = true;
this.setState({ owned: owned, placed: placed, coins: s.coins - it.cost, toast: 'Placed: ' + it.name });
} else {
placed[id] = !placed[id];
this.setState({ placed: placed, toast: placed[id] ? 'Placed: ' + it.name : 'Stored: ' + it.name });
}
setTimeout(() => this.setState({ toast: null }), 1800);
}
renderVals() {
const s = this.state;
const all = this.items();
const shown = all.filter((it) => it.cat === s.cat);
const tiles = shown.map((it) => {
const owned = !!s.owned[it.id];
const placed = !!s.placed[it.id];
const locked = !!it.locked;
const cant = !owned && !locked && s.coins < it.cost;
let chip = it.cost + ' coins';
let chipBg = '#F6E3A4';
if (locked) { chip = it.locked; chipBg = '#E4DACB'; }
else if (owned && placed) { chip = 'In room'; chipBg = '#CFE3B4'; }
else if (owned) { chip = 'Stored'; chipBg = '#FFFBF4'; }
const on = owned && placed;
return {
name: it.name,
chip: chip,
chipBg: chipBg,
bg: on ? '#F9C4BF' : '#EFE6D9',
bd: on ? '#7A5545' : 'transparent',
off: locked || cant,
fade: (locked || cant) ? 0.6 : 1,
isRug: it.kind === 'rug',
isLamp: it.kind === 'lamp',
isChair: it.kind === 'chair',
isArt: it.kind === 'art',
isPlant: it.kind === 'plant',
isLantern: it.kind === 'lantern',
tap: () => this.tap(it.id)
};
});
const cats = [['furniture', 'Furniture'], ['decor', 'Decor'], ['limited', 'Limited']];
const tabs = cats.map((c) => ({
label: c[1],
bg: s.cat === c[0] ? '#FBF3E6' : '#F5B0AA',
bb: s.cat === c[0] ? '3px solid #FBF3E6' : '3px solid #7A5545',
on: s.cat === c[0],
pick: () => this.setState({ cat: c[0] })
}));
const p = s.placed;
return {
coins: s.coins,
tiles: tiles,
tabs: tabs,
o: { rug: p.rug ? 1 : 0, lamp: p.lamp ? 1 : 0, chair: p.chair ? 1 : 0, art: p.art ? 1 : 0, plant: p.plant ? 1 : 0 },
partner: s.partner,
partnerO: s.partner ? 1 : 0,
partnerBg: s.partner ? '#F9C4BF' : '#FFFBF4',
partnerLabel: s.partner ? 'Shared Home: partner joined' : 'Invite a partner',
togglePartner: () => this.setState({ partner: !this.state.partner }),
meX: s.partner ? 150 : 171,
hasToast: !!s.toast,
toast: s.toast || ''
};
}
}
</script>
