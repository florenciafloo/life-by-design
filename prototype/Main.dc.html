<!doctype html>
<html lang="en">
<head>

<body>
<x-dc>
<helmet>

<style>
body{margin:0}
a{color:inherit;text-decoration:none}
.fd{font-family:'Fredoka','Nunito',sans-serif}
.chip{border:3px solid #7A5545;border-radius:16px;box-shadow:0 3px 0 #D9B8A0;cursor:pointer;font-family:'Fredoka','Nunito',sans-serif;font-weight:600;color:#6A4A3C;background:#FFFBF4}
.chip:active{transform:translateY(2px);box-shadow:0 1px 0 #D9B8A0}
.chip:disabled{cursor:default}
.wood{border:3px solid #7A5545;border-radius:16px;background:#F59A93;box-shadow:0 3px 0 #C9726C;color:#FFFBF4;text-shadow:0 1px 0 #B85C57;font-family:'Fredoka','Nunito',sans-serif;font-weight:600;cursor:pointer}
.wood:active{transform:translateY(2px);box-shadow:0 1px 0 #C9726C}
.wood:disabled{background:#D9C9BC;border-color:#A8907F;box-shadow:0 3px 0 #A8907F;text-shadow:none;cursor:default}
.pill{display:flex;align-items:center;gap:6px;height:36px;padding:0 6px;box-sizing:border-box;border-radius:18px;background:#FFFBF4;border:3px solid #7A5545;font-family:'Fredoka','Nunito',sans-serif;font-weight:600;font-size:16px;color:#6A4A3C}
.plus{width:22px;height:22px;box-sizing:border-box;border-radius:11px;background:#8CCB6B;border:2px solid #7A5545;color:#FFFFFF;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;line-height:1}
.nav{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-around;align-items:center;height:92px;box-sizing:border-box;padding:10px 8px 14px;background:#FBF1DE;border-top:3px solid #7A5545;z-index:5}
.tile{position:relative;width:62px;height:64px;box-sizing:border-box;border:3px solid #7A5545;border-radius:16px;background:#FFFBF4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-family:'Fredoka','Nunito',sans-serif;font-size:11.5px;font-weight:600;color:#6A4A3C}
.tile.on{background:#CFE3B4}
.tile:active{transform:translateY(2px)}
.rdot{position:absolute;top:-9px;right:-7px;width:18px;height:18px;box-sizing:border-box;border-radius:50%;background:#F04E4E;border:2.5px solid #FFFBF4}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
</style>

roke-width="3" stroke-linecap="round"/><g stroke="#7A5545" stroke-width="1.8"><circle cx="15" cy="11" r="5" fill="#F6B24A"/><circle cx="30" cy="7.5" r="5.5" fill="#F6B24A"/><circle cx="45" cy="11" r="5" fill="#F6B24A"/></g><g fill="#FFF3C4"><circle cx="15" cy="11" r="1.8"/><circle cx="30" cy="7.5" r="2"/><circle cx="45" cy="11" r="1.8"/></g></g><g style="opacity: {{clipO}}"><g stroke="#7A5545" stroke-width="1.8"><circle cx="44" cy="16" r="5.5" fill="#8B5E45"/><circle cx="40.5" cy="12" r="2.2" fill="#8B5E45"/><circle cx="47.5" cy="12" r="2.2" fill="#8B5E45"/><circle cx="44" cy="17.5" r="2" fill="#F6DCC8"/></g></g><g style="opacity: {{glassO}}"><g fill="none" stroke="#F0A23C" stroke-width="2"><circle cx="21" cy="36" r="7.5"/><circle cx="39" cy="36" r="7.5"/><path d="M28.5 36H31.5"/></g></g></g>

<sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
<button type="button" onClick="{{t.pick}}" aria-pressed="{{t.on}}" class="fd" style="flex: 1; height: 46px; box-sizing: border-box; border: 3px solid #7A5545; border-bottom: {{t.bb}}; border-radius: 16px 16px 0 0; background: {{t.bg}}; font-size: 13px; font-weight: 600; color: #6A4A3C; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 4px; padding: 0 2px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7A5545" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.icon}}"/></svg>{{t.label}}</button>
</sc-for>
</div>
<div style="position: absolute; left: 0; right: 0; top: 472px; bottom: 0; background: #FBF3E6; border-top: 3px solid #7A5545"></div>
<div style="position: absolute; left: 16px; right: 16px; top: 490px; z-index: 3; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{cards}}" as="c" hint-placeholder-count="6">
<button type="button" onClick="{{c.pick}}" aria-pressed="{{c.on}}" style="position: relative; height: 100px; box-sizing: border-box; border: 3px solid {{c.bd}}; border-radius: 18px; background: {{c.bg}}; padding: 6px 4px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: space-between; font-family: inherit; color: #6A4A3C">
<span style="display: flex; align-items: center; justify-content: center; height: 48px">

<sc-if value="{{c.isShirt}}" hint-placeholder-val="{{false}}"><svg width="46" height="40" viewBox="0 0 46 40" aria-hidden="true"><path d="M15 4L4 10L8 19L13 17V36H33V17L38 19L42 10L31 4C29 9 17 9 15 4Z" fill="{{c.col}}" stroke="#7A5545" stroke-width="2.2" stroke-linejoin="round"/></svg></sc-if>
<sc-if value="{{c.isNone}}" hint-placeholder-val="{{false}}"><svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="14" fill="none" stroke="#FFFBF4" stroke-width="5"/><path d="M11 29L29 11" stroke="#FFFBF4" stroke-width="5" stroke-linecap="round"/></svg></sc-if>

</span>
<span class="fd" style="font-size: 12.5px; font-weight: 600; line-height: 1.15; text-align: center">{{c.name}}</span>
<sc-if value="{{c.on}}" hint-placeholder-val="{{false}}"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" style="position: absolute; right: 5px; bottom: 5px"><path d="M12 2L14.5 9.5L22 12L14.5 14.5L12 22L9.5 14.5L2 12L9.5 9.5Z" fill="#F6C94A" stroke="#7A5545" stroke-width="1.8" stroke-linejoin="round"/></svg></sc-if>

</div>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { tab: 'hair', hair: 0, dress: 0, extra: 1, path: 1, flipped: false };
}
renderVals() {
const s = this.state;
const H = [['#A9D8E8', '#7FB5C9', 'Sky'], ['#FFFBF4', '#D6CFC6', 'Cream'], ['#F6DE8A', '#E0B84F', 'Honey'], ['#F6B8C4', '#D98C9E', 'Blush'], ['#C9B6EA', '#9E8AC9', 'Lilac'], ['#9A6B4A', '#6E4A33', 'Cocoa']];
const D = [['#F6D77A', 'Butter'], ['#8FB8D9', 'Sky'], ['#F3B8B0', 'Rose'], ['#B7D3A0', 'Sage'], ['#4A6FAE', 'Navy'], ['#C9B6EA', 'Lilac']];
const E = [['none', 'None'], ['crown', 'Flower crown'], ['clip', 'Bear clip'], ['glass', 'Round glasses']];
const P = [['home', 'Solo living'], ['ring', 'Wedding'], ['both', 'Both paths']];
const base = { col: '#FFFFFF', isHair: false, isShirt: false, isNone: false, isCrown: false, isClip: false, isGlass: false, isHome: false, isRing: false, isBoth: false };
const mk = (o, on, pick) => Object.assign({}, base, o, { on: on, bg: on ? '#F9C4BF' : '#EFE6D9', bd: on ? '#7A5545' : 'transparent', pick: pick });
let cards = [];
let hint = '';
if (s.tab === 'hair') {
cards = H.map((h, i) => mk({ isHair: true, col: h[0], name: h[2] + ' hair' }, s.hair === i, () => this.setState({ hair: i })));
hint = 'Pick a hair color';
} else if (s.tab === 'outfit') {
cards = D.map((d, i) => mk({ isShirt: true, col: d[0], name: d[1] + ' outfit' }, s.dress === i, () => this.setState({ dress: i })));
hint = 'Pick an outfit color';
} else if (s.tab === 'extra') {
cards = E.map((e, i) => mk({ isNone: e[0] === 'none', isCrown: e[0] === 'crown', isClip: e[0] === 'clip', isGlass: e[0] === 'glass', name: e[1] }, s.extra === i, () => this.setState({ extra: i })));
hint = 'One extra at a time';
} else {
cards = P.map((p, i) => mk({ isHome: p[0] === 'home', isRing: p[0] === 'ring', isBoth: p[0] === 'both', name: p[1] }, s.path === i, () => this.setState({ path: i })));
hint = 'Both story lines are equal. Switch any time.';
}
const T = [['hair', 'Hair', 'M5 14C4 7 9 3 12 3C15 3 20 7 19 14C19 17 19 19 17 20C17 18 17 16 15 15H9C7 16 7 18 7 20C5 19 5 17 5 14Z'], ['outfit', 'Outfit', 'M8 3L3 6L5 10L8 9V20H16V9L19 10L21 6L16 3C15 5 9 5 8 3Z'], ['extra', 'Extras', 'M12 3L14.5 9.5L21 12L14.5 14.5L12 21L9.5 14.5L3 12L9.5 9.5Z'], ['story', 'Story', 'M4 5H11V19H4ZM13 5H20V19H13Z']];
const tabs = T.map((t) => ({ label: t[1], icon: t[2], on: s.tab === t[0], bg: s.tab === t[0] ? '#FBF3E6' : '#F5B0AA', bb: s.tab === t[0] ? '3px solid #FBF3E6' : '3px solid #7A5545', pick: () => this.setState({ tab: t[0] }) }));
return {
hair: H[s.hair][0],
hair2: H[s.hair][1],
dress: D[s.dress][0],
crownO: s.extra === 1 ? 1 : 0,
clipO: s.extra === 2 ? 1 : 0,
glassO: s.extra === 3 ? 1 : 0,
flip: s.flipped ? 'scaleX(-1)' : 'scaleX(1)',
turn: () => this.setState({ flipped: !this.state.flipped }),
tabs: tabs,
cards: cards,
hint: hint
};
}
}
</script>
